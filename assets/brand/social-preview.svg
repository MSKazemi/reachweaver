  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72F1DA"/><stop offset=".52" stop-color="#37DCCC"/><stop offset="1" stop-color="#329DEB"/></linearGradient>
  <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#789DFF"/><stop offset=".5" stop-color="#A587F9"/><stop offset="1" stop-color="#DA7DE5"/></linearGradient>
  <clipPath id="bridge"><rect x="0" y="0" width="512" height="1024"/></clipPath>
</defs>
<rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#night)"/>
<circle cx="520" cy="510" r="445" fill="url(#halo)"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M216 692 C355 692 374 344 512 344 C650 344 669 692 808 692" stroke="url(#iris)" stroke-width="78"/>
  <path d="M216 332 C355 332 374 680 512 680 C650 680 669 332 808 332" stroke="url(#aqua)" stroke-width="78"/>
  <g clip-path="url(#bridge)"><path d="M216 692 C355 692 374 344 512 344 C650 344 669 692 808 692" stroke="url(#iris)" stroke-width="78"/></g>
</g>
<g fill="#F6FAFF">
  <circle cx="216" cy="332" r="11"/>
  <circle cx="808" cy="332" r="11"/>
  <circle cx="216" cy="692" r="11"/>
  <circle cx="808" cy="692" r="11"/>
</g>
</g>
