<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="ReachWeaver: evidence-first social distribution for Claude Code">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10192E"/><stop offset="1" stop-color="#080D1C"/></linearGradient>
<radialGradient id="sky"><stop stop-color="#205A6C" stop-opacity=".35"/><stop offset="1" stop-color="#0C1223" stop-opacity="0"/></radialGradient></defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<circle cx="550" cy="60" r="570" fill="url(#sky)"/>
<g transform="translate(76,105) scale(.43)"><title id="title">ReachWeaver icon</title>
<desc id="desc">Two bright teal and violet threads weave together and connect four points, symbolizing careful cross-platform distribution.</desc>
<defs>
