name: Documentation website
# Builds https://mskazemi.com/reachweaver/ from docs/ and the other public guides (scripts/build_docs_site.py),
# checks it (broken links and anchors fail the Astro build; scripts/check_docs_site.py checks titles, descriptions,
# canonicals, sitemap, structured data and links to private files) and, on main only, deploys it to GitHub Pages.
# No credentials and no social platform are involved; the deploy uses the repository's own Pages token.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history: each page's "last updated" date comes from git log of its source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Generate the site content from the repository's Markdown
        run: python scripts/build_docs_site.py
      - name: Install the pinned site dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Build the site (fails on a broken internal link or anchor)
        working-directory: website
        run: npm run build
      - name: Check titles, descriptions, canonicals, sitemap, structured data and private links
        run: python scripts/check_docs_site.py website/dist
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
