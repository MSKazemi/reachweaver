name: Release skill bundle
# Runs only when the owner pushes a vX.Y.Z tag. Publishes skill.zip + skill.zip.sha256, which
# `scripts/install_skill.py` and `reachweaver update` download and verify. No social platform
# is contacted and no credential is used.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Tag must match the package version and the bundle must be in sync
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          ver = re.search(r'__version__ = "([^"]+)"', Path('reachweaver/__init__.py').read_text()).group(1)
          assert tag == ver, f'tag {tag} != reachweaver.__version__ {ver}'
          a, b = Path('reachweaver'), Path('.claude/skills/reachweaver/scripts/reachweaver')
          assert all((b / f.name).read_bytes() == f.read_bytes() for f in [*a.glob('*.py'), *a.glob('*.json')])
          PY
      - name: Offline tests
        run: python -m unittest discover -s tests
      - name: Build bundle and checksum
        run: |
          find .claude/skills/reachweaver -name __pycache__ -prune -exec rm -rf {} +
          (cd .claude/skills && python -m zipfile -c ../../skill.zip reachweaver)
          sha256sum skill.zip > skill.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" skill.zip skill.zip.sha256 --title "$GITHUB_REF_NAME" --generate-notes
